databaseChangeLog:
  - logicalFilePath: 20260619-2-create-tbl-token.yaml
  - changeSet:
      id: 20260619-2-create-tbl-token
      author: nurlan949
      changes:
        - createTable:
            tableName: tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: access_token
                  type: varchar(512)
                  constraints:
                    nullable: false

              - column:
                  name: token_type
                  type: varchar(255)

              - column:
                  name: expires_at
                  type: timestamp

              - column:
                  name: created_at
                  type: timestamp

