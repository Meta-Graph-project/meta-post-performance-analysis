version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: meta-performance
    restart: always

    environment:
      POSTGRES_DB: meta-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nurlan2006,

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: meta-post-performance-analysis:1.0
    container_name: meta-app
    restart: always

    depends_on:
      - postgres

    ports:
      - "8081:8080"

    environment:
      HOST: postgres
      PORT: 5432
      DB_NAME: meta-service
      SCHEMA: public
      USERNAME: postgres
      PAROL: Nurlan2006,

volumes:
  postgres_data: